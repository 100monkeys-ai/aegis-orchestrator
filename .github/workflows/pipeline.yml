#
# Unified CI/CD pipeline for aegis-orchestrator.
# All checks must pass before the build+deploy stage runs.

name: Pipeline

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: 100monkeys-ai/aegis-runtime

permissions:
  contents: read

jobs:
  # THROWAWAY, never merged: each job undoes one fix and runs the live
  # Keycloak tests, which must go red.
  mutation:
    name: Mutation (${{ matrix.mutation }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mutation: [policy, enabled, lock, invite, saml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator -> target
          save-if: false

      - name: Start Keycloak
        run: |
          docker run -d --name aegis-test-keycloak -p 127.0.0.1:18080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9 \
            start-dev
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/realms/master >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 50 aegis-test-keycloak
          exit 1

      - name: Undo the fix
        working-directory: aegis-orchestrator
        run: python3 .github/mutate.py ${{ matrix.mutation }}

      - name: Run the live Keycloak tests
        working-directory: aegis-orchestrator
        env:
          AEGIS_TEST_KEYCLOAK: "1"
          AEGIS_TEST_KEYCLOAK_URL: http://127.0.0.1:18080
        run: cargo test -p aegis-orchestrator-core --lib --locked live_tests -- --test-threads=2
