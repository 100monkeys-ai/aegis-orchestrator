#
# Unified CI/CD pipeline for aegis-orchestrator.
# All checks must pass before the build+deploy stage runs.

name: Pipeline

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: 100monkeys-ai/aegis-runtime

permissions:
  contents: read

jobs:
  # ── Stage 1: All checks in parallel ────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator -> target

      - name: Check formatting
        working-directory: aegis-orchestrator
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator -> target

      - name: Clippy
        working-directory: aegis-orchestrator
        run: cargo clippy --workspace --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    # A throwaway PostgreSQL for the tests that need a real database. The
    # major version is production's. Each such test makes its own database
    # on it and drops it at the end.
    services:
      postgres:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # PgBouncer in front of it, in transaction pooling mode as the
      # deployment runs it, with one server connection, for the tests of two
      # processes migrating at once.
      pgbouncer:
        image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: unused
          AUTH_TYPE: trust
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "1"
          LISTEN_PORT: "6432"
        ports:
          - 6432:6432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev openssh-server

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator -> target

      # The Keycloak the deployment moves to under AEGIS ADR-128
      # (quay.io/keycloak/keycloak:26.8.0, pinned by its linux/amd64 digest),
      # in development mode on the loopback interface, for the Keycloak admin
      # client's tests against the real thing. 26 reads the bootstrap admin
      # from KC_BOOTSTRAP_ADMIN_USERNAME and KC_BOOTSTRAP_ADMIN_PASSWORD.
      - name: Start Keycloak
        run: |
          docker run -d --name aegis-test-keycloak -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak@sha256:d79bc4bf1c54e802735ef91926b5c003de1fbb50b1a93382611972277219c9ad \
            start-dev
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/realms/master >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 50 aegis-test-keycloak
          exit 1

      - name: Run tests
        working-directory: aegis-orchestrator
        env:
          # With this set, the tests that need Keycloak fail when they cannot
          # reach it, instead of skipping.
          AEGIS_TEST_KEYCLOAK: "1"
          AEGIS_TEST_KEYCLOAK_URL: http://127.0.0.1:18080
          AEGIS_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
          AEGIS_TEST_PGBOUNCER_URL: postgres://postgres@localhost:6432/postgres
          # The runner has a container engine. With this set, a test that
          # needs one fails when it cannot reach it, instead of skipping.
          AEGIS_TEST_DOCKER: "1"
          # openssh-server is installed above. With this set, a test that
          # needs sshd fails when it cannot start one, instead of skipping.
          AEGIS_TEST_SSHD: "1"
        run: cargo test --workspace --locked

  doc:
    name: Documentation
    runs-on: ubuntu-22.04
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator -> target

      - name: Build documentation
        working-directory: aegis-orchestrator
        run: |
          cargo doc \
            --workspace \
            --locked \
            --no-deps \
            --document-private-items \
            -p aegis-orchestrator-core \
            -p aegis-orchestrator-swarm \
            -p aegis-orchestrator-sdk \
            -p aegis-orchestrator

  # ── Stage 2: Build + Publish (only after ALL checks pass) ──────────────────
  build-deploy:
    name: Build & Publish
    needs: [fmt, clippy, test, doc]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Ensure TMPDIR
        run: mkdir -p /home/runner/_work/_tmp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-orchestrator
          clean: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
          clean: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-ubuntu22"
          workspaces: aegis-orchestrator

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfuse3-dev libpq-dev pkg-config libssl-dev

      # Build the release binary using the persistent cargo cache
      - name: Build release binary
        working-directory: aegis-orchestrator
        run: cargo build --release --bin aegis --locked

      # Build the runtime Docker image locally with Podman
      - name: Build runtime image
        run: |
          cp aegis-orchestrator/target/release/aegis ./aegis
          podman build \
            -f aegis-orchestrator/docker/Dockerfile.runtime-slim \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} \
            .

      # Push to GHCR in parallel with deploy (for external consumers)
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}

      # Semver tags for release pushes
      - name: Tag and push semver (release only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1-2)
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$MINOR
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$MAJOR
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$MINOR
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$MAJOR

  # Redeploy the core pod on nuclear-vm-1 with the aegis-runtime image just
  # pushed (deploy-pod also replaces the relay-coordinator pod, which runs
  # the same image, and the FUSE daemon's binary): dispatch
  # aegis-platform-deployment's deploy-pod.yml (a reusable call is
  # impossible from this public repository to that internal one),
  # find that run by its run-name "deploy-pod core <sha>", and watch
  # it to its end, so this run goes red when the deploy does. Without the
  # organisation secret AEGIS_DEPLOY_DISPATCH_TOKEN this job fails, naming
  # it: a merge that does not deploy is visible.
  deploy:
    name: Deploy core (nuclear-vm-1)
    needs: [build-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 45
    concurrency:
      group: deploy-core
      cancel-in-progress: false
    steps:
      - name: Dispatch deploy-pod and watch it
        env:
          GH_TOKEN: ${{ secrets.AEGIS_DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_REPO: 100monkeys-ai/aegis-platform-deployment
          POD: core
          IMAGE: aegis-runtime
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the organisation secret AEGIS_DEPLOY_DISPATCH_TOKEN is not available to this repository, so ${SOURCE_SHA} was published but not deployed"
            exit 1
          fi
          title="deploy-pod ${POD} ${SOURCE_SHA}"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy-pod.yml --repo "$DEPLOY_REPO" --ref main \
            -f pod="$POD" -f image="$IMAGE" -f sha="$SOURCE_SHA"
          id=""
          for _ in $(seq 1 30); do
            id="$(gh run list --repo "$DEPLOY_REPO" --workflow deploy-pod.yml \
              --event workflow_dispatch --created ">=${started}" --limit 50 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle == \"${title}\")) | max_by(.databaseId) | .databaseId // empty")"
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::no deploy-pod run named '${title}' appeared in ${DEPLOY_REPO} within 300 s"
            exit 1
          fi
          echo "deploy-pod run ${id}: https://github.com/${DEPLOY_REPO}/actions/runs/${id}"
          gh run watch "$id" --repo "$DEPLOY_REPO" --exit-status --interval 15
