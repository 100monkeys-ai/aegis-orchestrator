apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "coder-agent"
  version: "1.0.0"
  description: "Changes a repository's implementation so that the tests written for it pass, following the approved design, never changing those tests. The Forge's CODE step."
  labels:
    role: "worker"
    category: "development"
    workflow: "the-forge"
    builtin: "true"

spec:
  runtime:
    language: "python"
    version: "3.11"
    model: "smart"
    isolation: "inherit"
    temperature: 0.2

  task:
    instruction: |
      You are the implementation engineer of a development workflow. You are
      given approved requirements, an approved design, the tests written for
      them, the command that runs the suite, and a repository checked out on
      its own work branch, at the path your input names. When you are entered
      again, your input also carries the last run of the suite or the last
      review's reports.

      1. Read the design, the tests and the code they touch.
      2. Change the implementation with fs.edit and fs.multi_edit, replacing
         only the lines the design touches; use fs.write only for a file that
         does not exist yet. Never rewrite a whole existing file, never change
         its line endings or its final newline, and add nothing the design
         does not ask for. Never change the tests the tester wrote, and never
         weaken a test to make it pass. Create no file the design does not
         name, and change only the lines the design names; a replacement
         carries no more blank lines than the surrounding text has.
      3. Run what you can with cmd.run to check your change.
      4. When your input carries a failed run of the suite, fix what its output
         names; when it carries a review below 0.95, fix every suggestion the
         reports make. If one test still fails after three of your attempts
         and its assertion cannot be met by an implementation the design asks
         for, stop and answer with the test's name, its assertion, and why it
         cannot pass; do not change the test.
      5. Answer with every file you changed, what changed in each, and how the
         change meets each acceptance criterion. Commit nothing: the workflow
         commits.
    prompt_template: |
      {{instruction}}

      {{input}}

  volumes:
    - name: workspace
      storage_class: ephemeral
      mount_path: "/workspace"
      access_mode: "read-write"
      size_limit: "2Gi"
      ttl_hours: 6

  execution:
    mode: "iterative"
    max_iterations: 5
    llm_timeout_seconds: 300
    iteration_timeout: "900s"
    require_tool_call: true
    validation:
      - type: semantic
        judge_agent: "code-quality-judge"
        criteria: |
          The implementation was changed as the design says, in the
          repository's conventions, with errors handled and no placeholder; no
          test the tester wrote was changed or weakened. The answer names each
          changed file and how each acceptance criterion is met.
        min_score: 0.7
        timeout_seconds: 300

  tools:
    - fs.read
    - fs.list
    - fs.search
    - fs.grep
    - fs.glob
    - fs.write
    - fs.edit
    - fs.multi_edit
    - fs.create_dir
    - fs.delete
    - cmd.run
    - aegis.git.status
    - aegis.git.diff

  security:
    network:
      mode: "none"
    filesystem:
      read:
        - "/workspace"
      write:
        - "/workspace"
    resources:
      cpu: 1000
      memory: "1Gi"
      timeout: "2445s"
