apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "requirements-analyst"
  version: "1.0.1"
  description: "Reads a repository and a development task, and answers the functional and non-functional requirements and the acceptance criteria, each criterion bound to the change the task names and to files that exist or that the change will create. The Forge's ANALYZE step."
  labels:
    role: "worker"
    category: "development"
    workflow: "the-forge"
    builtin: "true"

spec:
  runtime:
    language: "python"
    version: "3.11"
    model: "smart"
    isolation: "inherit"
    temperature: 0.2

  task:
    instruction: |
      You are the requirements analyst of a development workflow. You are given
      a task and a repository checked out on its own work branch, at the path
      your input names. You read; you change nothing.

      1. Read the repository before you write a word: list its layout with
         fs.list and fs.glob, read the files the task touches and their tests
         with fs.read, fs.search, which finds where something is, and fs.grep,
         and see the working tree with aegis.git.status.
      2. Answer with:
         - the functional requirements, numbered, each one atomic;
         - the non-functional requirements (performance, security,
           maintainability, compatibility), numbered;
         - the acceptance criteria, numbered, each one checkable by a test in
           the repository's own test layout and naming only the change the
           task calls for and the files that exist or that the change will
           create;
         - the edge cases and the failure modes the change must handle;
         - every ambiguity in the task, with the reading you chose.
      No acceptance criterion names a file the workflow does not produce: the
      workflow writes no requirements.md, architecture.md, test-strategy.md or
      constitution-proposals.md. No criterion asserts on the repository's
      branches, history or remote: the change lives on the work branch, never
      main.
      The answer is one JSON object and nothing else: "acceptance_criteria",
      a list of strings, each one criterion in one sentence, and
      "requirements", a string holding everything else above.
      Name files by their paths in the repository. Be thorough and concise.
    prompt_template: |
      {{instruction}}

      {{input}}

  execution:
    mode: "iterative"
    max_iterations: 5
    llm_timeout_seconds: 300
    iteration_timeout: "900s"
    require_tool_call: true
    validation:
      # AEGIS ADR-141, Update of 2026-10-14, R6: the answer's shape, checked
      # before the judge; the tester's done_when counts acceptance_criteria.
      - type: json_schema
        schema:
          type: object
          required: [requirements, acceptance_criteria]
          additionalProperties: false
          properties:
            requirements:
              type: string
              minLength: 1
            acceptance_criteria:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
      - type: semantic
        judge_agent: "code-quality-judge"
        criteria: |
          The answer is a requirements specification for the task, grounded in
          the repository: numbered functional and non-functional requirements,
          numbered acceptance criteria each checkable by a test, edge cases,
          and the ambiguities with the reading chosen. It names real files of
          the repository and invents none. No criterion names a file the
          workflow does not produce, and no criterion asserts on the
          repository's branches, history or remote.
        min_score: 0.7
        timeout_seconds: 300

  tools:
    - fs.read
    - fs.list
    - fs.search
    - fs.grep
    - fs.glob
    - aegis.git.status
    - aegis.git.diff

  security:
    network:
      mode: "none"
    filesystem:
      read:
        - "/workspace"
      write: []
    resources:
      cpu: 1000
      memory: "1Gi"
      timeout: "2445s"