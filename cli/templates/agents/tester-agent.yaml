apiVersion: 100monkeys.ai/v1
kind: Agent

metadata:
  name: "tester-agent"
  version: "1.0.0"
  description: "Writes the tests for approved requirements and design, in a repository's own test layout, red against the unchanged tree. The Forge's TEST step."
  labels:
    role: "worker"
    category: "development"
    workflow: "the-forge"
    builtin: "true"

spec:
  runtime:
    language: "python"
    version: "3.11"
    model: "smart"
    isolation: "inherit"
    temperature: 0.2

  task:
    instruction: |
      You are the test engineer of a development workflow. You are given
      approved requirements, an approved design, the command that runs the
      suite, a repository checked out on its own work branch at the path your
      input names, and the list of test files the repository tracks.

      1. Read those of the listed test files you need to learn the
         repository's test layout, framework and style. When the list is
         empty, the repository has no tests yet: choose the layout the
         design names, or the language's common one.
      2. Write one test file for each acceptance criterion, in that layout
         and style, with fs.write, under the repository's path. Test only
         what an acceptance criterion names; never test formatting,
         whitespace or line endings that no acceptance criterion names, and
         a design's line endings or escape sequences are not criteria: no
         test asserts on '\r', a line ending or a byte sequence. When a test
         reads a text file, read it the way the suite's own tests do, and
         never assert on an escaped sequence such as '\\n' where a newline
         is meant. Write tests only: change no implementation file, and
         never test the repository's branches, history or remote.
      3. Do not run the tests: the suite runs later, in its own container,
         after the code is written. Your try ends when each acceptance
         criterion has its test file; the orchestrator then answers with the
         files you wrote.
      4. The answer is the list of the test files you wrote, each with its
         path and its content.
    prompt_template: |
      {{instruction}}

      {{input}}

  volumes:
    - name: workspace
      storage_class: ephemeral
      mount_path: "/workspace"
      access_mode: "read-write"
      size_limit: "2Gi"
      ttl_hours: 6

  execution:
    mode: "iterative"
    max_iterations: 5
    iteration_timeout: "900s"
    llm_timeout_seconds: 120
    require_tool_call: true
    # AEGIS ADR-141, Update of 2026-10-14, R4, R3 and R6: at most 24 tool
    # calls a try; the try ends when the repository holds one new file per
    # entry of the analyst's acceptance_criteria list.
    max_tool_calls: 24
    done_when:
      new_files:
        under: "{{repository.path}}"
        count: "{{#if ANALYZE.output.acceptance_criteria}}{{len ANALYZE.output.acceptance_criteria}}{{/if}}"
    validation:
      - type: semantic
        judge_agent: "code-quality-judge"
        criteria: |
          Tests were written in the repository's own layout and style, one or
          more for each acceptance criterion, real executable test code with no
          placeholder, and no implementation file was changed. The answer names
          each test file and the criterion each test shows. No test asserts
          on a line ending, a '\r' or an escape sequence that no acceptance
          criterion names.
        min_score: 0.7
        timeout_seconds: 300

  tools:
    - fs.read
    - fs.list
    - fs.search
    - fs.grep
    - fs.glob
    - fs.write
    - fs.edit
    - fs.multi_edit
    - fs.create_dir
    - fs.delete
    - cmd.run
    - aegis.git.status
    - aegis.git.diff

  security:
    network:
      mode: "none"
    filesystem:
      read:
        - "/workspace"
      write:
        - "/workspace"
    resources:
      cpu: 1000
      memory: "1Gi"
      timeout: "2445s"
