apiVersion: 100monkeys.ai/v1
kind: NodeConfig
metadata:
  name: edge
spec:
  node:
    id: "{{NODE_ID}}"
    type: edge
  cluster:
    enabled: true
    role: edge
    controller:
      endpoint: "{{CONTROLLER_ENDPOINT}}"
      tls:
        enabled: true
    node_keypair_path: ~/.aegis/edge/node.key
    edge:
      tenant_id: null
      enrollment_token_path: ~/.aegis/edge/enrollment.jwt
      node_security_token_path: ~/.aegis/edge/node.token
      capabilities:
        os: "{{OS}}"
        arch: "{{ARCH}}"
        local_tools: [shell]
        mount_points: ["/"]
  # Deny by default (ADR-157): a dispatch names the context of its caller's
  # tier, and each allows only host.facts, which reads and changes nothing.
  # Grant more deliberately, for example `cmd.run` with a command_allowlist
  # or `host.apply` for host state, by widening a context here.
  security_contexts:
    - name: zaru-free
      description: "Read-only default for Free dispatches: host facts only."
      capabilities:
        - tool_pattern: "host.facts"
      deny_list: []
    - name: zaru-pro
      description: "Read-only default for Pro dispatches: host facts only."
      capabilities:
        - tool_pattern: "host.facts"
      deny_list: []
    - name: zaru-business
      description: "Read-only default for Business dispatches: host facts only."
      capabilities:
        - tool_pattern: "host.facts"
      deny_list: []
    - name: zaru-enterprise
      description: "Read-only default for Enterprise dispatches: host facts only."
      capabilities:
        - tool_pattern: "host.facts"
      deny_list: []
