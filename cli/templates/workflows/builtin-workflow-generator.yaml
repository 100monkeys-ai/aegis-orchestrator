apiVersion: 100monkeys.ai/v1
kind: Workflow
metadata:
  name: builtin-workflow-generator
  version: "1.0.0"
  description: Built-in one-command workflow generator that discovers existing agents, generates missing agents, and registers a final runnable workflow.
  labels:
    category: platform
    type: builtin-generator
  input_schema:
    type: object
    properties:
      input:
        type: string
        description: Natural language description of the workflow to generate
    required:
      - input
spec:
  initial_state: PLAN
  states:
    PLAN:
      kind: Agent
      agent: workflow-generator-planner-agent
      input: |
        Build a complete generation plan for this workflow request:
        {{input.input}}
      transitions:
        - condition: on_success
          target: GENERATE_MISSING_AGENTS

    GENERATE_MISSING_AGENTS:
      kind: Agent
      agent: agent-creator-agent
      # agent-creator-agent's input_schema wants an object with `input`, so
      # this input renders as one JSON object (ADR-092 D7): the request in
      # `input`, the planner's answer as JSON in `planner_output`.
      input: |
        {
          "input": "Use the planner output in `planner_output`. Create all missing agents listed in its `missing_agents` and `missing_judge_agents` using its `generation_prompts` and `judge_generation_prompts`. If there are no missing agents or judges, return a JSON no-op summary with empty `created`.",
          "planner_output": {{{json PLAN.output}}}
        }
      transitions:
        - condition: on_success
          target: GENERATE_AND_REGISTER_WORKFLOW
        - condition: on_failure
          target: GENERATE_AND_REGISTER_WORKFLOW

    GENERATE_AND_REGISTER_WORKFLOW:
      kind: Agent
      agent: workflow-creator-validator-agent
      input: |
        Original workflow request:
        {{input.input}}

        Planner output:
        {{{json PLAN.output}}}

        Agent generation output:
        {{{json GENERATE_MISSING_AGENTS.output}}}

        Generate and register the final workflow so it is runnable immediately.
        Use only resolved existing judge agents or judges created in this generation flow.
      transitions: []
