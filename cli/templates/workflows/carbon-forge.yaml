#
# Carbon Forge: The Forge on a Carbon Forge tree (AEGIS ADR-147).
#
#   ANALYZE ─► AWAIT_REQUIREMENTS_APPROVAL ─yes─► ARCHITECT ─► AWAIT_ARCH_APPROVAL ─yes─► TEST ◄─┐
#      ▲                 │ no                        ▲                  │ no                │    │ the tests
#      └─────────────────┘                           └──────────────────┘                   ▼    │ did not load
#                                                                                     CHECK_TESTS ┘
#                                                                                           │ any other run
#   CODE ◄──────────── exit_code_non_zero ─── EXECUTE_TESTS ◄───────────────────────────── CODE
#    ▲                                            │ exit_code_zero
#    │ score_below 0.95                           ▼
#    └────────────────────────── AUDIT ◄──────── DIFF (tree_diff)
#                                  │ consensus 0.95, agreement 0.8
#                                  ▼
#                               COMMIT (tree_write)
#                                  │
#                                  ▼
#                               DRIFT (drift_report) ─ draft_only (default) ─► COMPLETE
#                                  │ draft_only false, whatever the report
#                                  ▼
#                                LAND (tree_land) ─► CUT (tree_cut) ─► COMPLETE, or LAND_REFUSED / CUT_REFUSED
#
# The Forge's states, kept as they are (C3). The run names its tree by the
# dispatch key `trees`, [{workspace, path, revision}], beside its `contexts`
# (C2); before the first agent the tree's revision is materialized into the
# run's volume `tree`, every file verified against its SHA-256, and mounted
# at /workspace in every agent state and step container (C4). DIFF is the
# run's change against that revision; COMMIT writes the run's tree to a lane
# of the run's own; LAND lands that lane as one changeset after your
# approval, and a conflict ends in LAND_REFUSED with Carbon Forge's own
# sentence (C5). draft_only (the default) ends at COMPLETE with the change
# on the lane (C6). Every path in the prompts and in tests is written
# relative to the tree's root, never absolute.
#
# DRIFT reads the lane's drift report (AEGIS ADR-147 Update
# drift-report-at-the-gate-2026-10-23): each definition the change adds,
# removes or re-signs in a seam the workspace's governed seams declare, and
# whether a page governing it changed on the lane too. The report advises
# and never ends the run: a report, a refusal and a failure all go on, and
# the blackboard's `drift` keeps the report, or the sentence of a report
# that was not read. LAND's approval request shows you the counts by class
# and the first ten findings beside the tree, the lane and the intent; the
# verdict stays yours.
#
# A landed run becomes a cut (AEGIS ADR-149 C1): CUT names a snapshot of the
# tree's workspace with the dispatch's `cut`, else forge-<execution id>, and
# a refusal ends in CUT_REFUSED with Carbon Forge's own sentence. The step's
# answer carries the cut name in `ref` and the snapshot id in `commit_sha`,
# which COMPLETE records as `cut` and `snapshot_id`. A draft_only run never
# reaches LAND, and so never cuts.

apiVersion: 100monkeys.ai/v1
kind: Workflow

metadata:
  name: "carbon-forge"
  version: "1.2.0"
  description: |-
    Develops one change in one of your Carbon Forge trees: requirements and a
    design, each approved by you, then tests written first, the implementation,
    your test suite run in a container on the tree, a review by three judges,
    and the change written to the run's own lane. With draft_only false, the
    lane then lands on the trunk as one changeset after your approval.
  labels:
    builtin: "true"
    category: "development"
  input_schema:
    type: object
    properties:
      task:
        type: string
        description: "What to change. Its first line names the change."
      test_command:
        type: string
        description: "The test suite, run by /bin/sh -c in the tree's root."
      test_image:
        type: string
        description: "The image the test suite runs in, a reference with a tag."
      context:
        type: string
        description: "Anything else the analyst should know."
      draft_only:
        type: boolean
        default: true
        description: "True (the default) ends the run with the change on the run's lane and the trunk untouched; false lands the lane on the trunk as one changeset after your approval."
      cut:
        type: string
        description: "Name the cut the landed run becomes; default forge-<execution id>"
    required:
      - task
      - test_command
      - test_image

spec:
  # The run names exactly one tree by the dispatch key `trees`.

  context:
    max_code_iterations: 5

  initial_state: ANALYZE

  states:

    ANALYZE:
      kind: Agent
      agent: "requirements-analyst"
      input: |-
        # The task
        {{{input.task}}}
        {{#if input.context}}

        # Context
        {{{input.context}}}
        {{/if}}

        # The tree
        The tree is at /workspace, as its revision left it. Read it before you answer: its layout, its conventions, the code the task touches and its tests. Change nothing.

        The test suite will be run later in a container with the tree mounted at /workspace and the working directory /workspace: every path is written relative to the tree's root, never an absolute /workspace/... path. The suite's command: {{{input.test_command}}}
        {{#if AWAIT_REQUIREMENTS_APPROVAL}}

        # Your last requirements were sent back
        The person answered "{{AWAIT_REQUIREMENTS_APPROVAL.response}}" to them. Write them again, closer to the task.
        {{#if human.feedback}}
        Their words: {{{human.feedback}}}
        {{/if}}
        {{/if}}

        Answer with the functional requirements, the non-functional requirements and the acceptance criteria, each numbered and each checkable by a test.
      transitions:
        - condition: on_success
          target: AWAIT_REQUIREMENTS_APPROVAL
        - condition: on_failure
          target: FAILED

    AWAIT_REQUIREMENTS_APPROVAL:
      kind: Human
      timeout: 3600s
      prompt: |-
        # Carbon Forge: approve the requirements

        ## The task
        {{{input.task}}}

        ## The requirements
        {{{json ANALYZE.output}}}

        Answer yes to design the change against them, or no with what to change.
      transitions:
        - condition: input_equals_yes
          target: ARCHITECT
        - condition: input_equals_no
          target: ANALYZE
          feedback: "{{human.feedback}}"

    ARCHITECT:
      kind: Agent
      agent: "architect-agent"
      input: |-
        # The task
        {{{input.task}}}

        # The approved requirements
        {{{json ANALYZE.output}}}

        # The tree
        The tree is at /workspace. Read its layout and its conventions before you design anything. Change nothing.

        The test suite will be run later in a container with the tree mounted at /workspace and the working directory /workspace: name every path relative to the tree's root, never an absolute /workspace/... path.
        {{#if AWAIT_ARCH_APPROVAL}}

        # Your last design was sent back
        The person answered "{{AWAIT_ARCH_APPROVAL.response}}" to it. Design it again, closer to the requirements.
        {{#if human.feedback}}
        Their words: {{{human.feedback}}}
        {{/if}}
        {{/if}}

        Design the change against the requirements and the tree's own conventions. Name every file to change or create, by its path relative to the tree's root, with what changes in it, and name the tests that will show each acceptance criterion met.
      transitions:
        - condition: on_success
          target: AWAIT_ARCH_APPROVAL
        - condition: on_failure
          target: FAILED

    AWAIT_ARCH_APPROVAL:
      kind: Human
      timeout: 3600s
      prompt: |-
        # Carbon Forge: approve the design

        ## The task
        {{{input.task}}}

        ## The requirements
        {{{json ANALYZE.output}}}

        ## The design
        {{{json ARCHITECT.output}}}

        Answer yes to write the tests and the implementation, or no with what to change.
      transitions:
        - condition: input_equals_yes
          target: TEST
        - condition: input_equals_no
          target: ARCHITECT
          feedback: "{{human.feedback}}"

    TEST:
      kind: Agent
      agent: "tester-agent"
      # TEST and CHECK_TESTS's returns to it: a third suite that does not load
      # ends the run.
      max_state_visits: 3
      input: |-
        # The approved requirements
        {{{json ANALYZE.output}}}

        # The approved design
        {{{json ARCHITECT.output}}}

        # The tree
        The tree is at /workspace. The suite will be run later in a container with the tree mounted at /workspace and the working directory /workspace, in the tree's root with: {{{input.test_command}}} Write every test path relative to the tree's root, never an absolute /workspace/... path.

        The suite runs in the given test image as it is, with nothing installed: a test uses only the runtime's standard library and the tree's own files, never a third-party module or an external binary the image may lack, and reads a text file in text mode or normalizes \r\n so a content match holds on CRLF.
        {{#if CHECK_TESTS}}

        # The tests did not load
        The suite was run once on the tests you wrote, and a file you wrote did not load: it does not parse, or its own module cannot be imported. Fix those files so that every test loads and runs; a test may still fail where the implementation is not written yet. Change no implementation file.

        stderr:
        {{{CHECK_TESTS.output.stderr}}}

        stdout:
        {{{CHECK_TESTS.output.stdout}}}
        {{/if}}

        Write the tests that show each acceptance criterion met, in the tree's own test layout and style, under /workspace. Write tests only: change no implementation file.
      transitions:
        - condition: on_success
          target: CHECK_TESTS
        - condition: on_failure
          target: FAILED

    CHECK_TESTS:
      kind: ContainerRun
      name: "carbon-forge-check-tests"
      image: "{{input.test_image}}"
      shell: true
      # The suite once, before CODE, with EXECUTE_TESTS's image and command.
      # The image is the caller's test_image as it is: nothing is installed,
      # tests are standard-library only, and text files are read robustly to
      # line endings (text mode, or \r\n normalized).
      # Its output is printed as it was. When it shows that a test file the
      # tester wrote did not load, the step exits 86 and the run goes back to
      # TEST; any other run, its own exit code (a suite's own 86 as 1), goes
      # to CODE. A file does not load when the suite names it as not loaded
      # (unittest's _FailedTest, pytest's "ERROR collecting") and either a
      # SyntaxError, IndentationError or TabError points into the tree, or
      # the module that cannot be found is the test module itself. A test
      # importing code not written yet is CODE's to write. At this step the
      # tree holds no change but the tester's. The suite runs in a subshell,
      # so its own exit ends only it. Plain sh, grep and sed: the image is the
      # person's.
      command:
        - |-
          out="${TMPDIR:-/tmp}/forge-check-tests.$$.out"
          err="${TMPDIR:-/tmp}/forge-check-tests.$$.err"
          (eval "$FORGE_TEST_COMMAND") >"$out" 2>"$err"
          code=$?
          cat "$out"
          cat "$err" >&2
          all="$out.all"
          cat "$out" "$err" >"$all"
          loaded=yes
          if grep -Eq '_FailedTest|Failed to import test module|ERROR collecting|ImportError while importing test module' "$all"; then
            where=$(sed -nE '/File "/h; /(SyntaxError|IndentationError|TabError): /{x;p;q;}' "$all")
            case "$where" in
              *'File "'"$PWD/"*) loaded=no ;;
              *'File "/'*|*'File "<'*|'') ;;
              *'File "'*) loaded=no ;;
            esac
            for missing in $(sed -n "s/.*No module named '\([^']*\)'./\1/p" "$all"); do
              for module in $(sed -n 's/.*Failed to import test module: \([A-Za-z0-9_.]*\).*/\1/p' "$all") $(sed -n 's/.*ERROR collecting \([^ ]*\)\.py.*/\1/p' "$all" | tr / .); do
                case "$module" in
                  "$missing"|"$missing".*|*."$missing") loaded=no ;;
                esac
              done
            done
          fi
          rm -f "$out" "$err" "$all"
          if [ "$loaded" = no ]; then exit 86; fi
          if [ "$code" -eq 86 ]; then exit 1; fi
          exit "$code"
      env:
        FORGE_TEST_COMMAND: "{{{input.test_command}}}"
      workdir: "/workspace"
      volumes:
        - name: tree
          mount_path: "/workspace"
      network_mode: egress
      resources:
        cpu: 2000
        memory: "4Gi"
        timeout: 1800s
      transitions:
        - condition: exit_code
          value: 86
          target: TEST
        - condition: always
          target: CODE

    CODE:
      kind: Agent
      agent: "coder-agent"
      max_state_visits: 5
      input: |-
        # The approved requirements
        {{{json ANALYZE.output}}}

        # The approved design
        {{{json ARCHITECT.output}}}

        # The tests written for it
        {{{json TEST.output}}}

        # The tree
        The tree is at /workspace. The suite will be run in a container with the tree mounted at /workspace and the working directory /workspace, in the tree's root with: {{{input.test_command}}} Write and change paths relative to the tree's root, never an absolute /workspace/... path.
        {{#if EXECUTE_TESTS}}

        # The last run of the suite
        Exit code {{EXECUTE_TESTS.output.exit_code}}.

        stderr:
        {{{EXECUTE_TESTS.output.stderr}}}

        stdout:
        {{{EXECUTE_TESTS.output.stdout}}}
        {{else}}
        {{#if CHECK_TESTS}}

        # The last run of the suite
        Exit code {{CHECK_TESTS.output.exit_code}}.

        stderr:
        {{{CHECK_TESTS.output.stderr}}}

        stdout:
        {{{CHECK_TESTS.output.stdout}}}
        {{/if}}
        {{/if}}
        {{#if AUDIT}}

        # The last review
        The three judges scored the change {{AUDIT.consensus.score}} (0.95 passes). Their reports:
        {{{json AUDIT.consensus.metadata.individual_outputs}}}

        A review's suggestion to change, delete or add a test is not yours to apply: leave the tests as the tester wrote them and name the suggestion in your answer.

        # The change they reviewed (a unified diff: lines beginning with - and + are the diff's markers, not the text)
        {{{DIFF.output.diff}}}
        {{/if}}

        Change the implementation under /workspace as the design says, so that the suite passes. Never change the tests the tester wrote. When the suite has failed or the review has scored the change below 0.95, fix what the output and the reports name.
      transitions:
        - condition: on_success
          target: EXECUTE_TESTS
        - condition: on_failure
          target: FAILED

    EXECUTE_TESTS:
      kind: ContainerRun
      name: "carbon-forge-tests"
      image: "{{input.test_image}}"
      shell: true
      # Runs in the caller's test_image as it is: nothing is installed, tests
      # are standard-library only, and text files are read robustly to line
      # endings (text mode, or \r\n normalized).
      # The suite reaches the step's shell through its environment, never
      # spliced into the shell text.
      command:
        - "eval \"$FORGE_TEST_COMMAND\""
      env:
        FORGE_TEST_COMMAND: "{{{input.test_command}}}"
      workdir: "/workspace"
      volumes:
        - name: tree
          mount_path: "/workspace"
      network_mode: egress
      resources:
        cpu: 2000
        memory: "4Gi"
        timeout: 1800s
      transitions:
        - condition: exit_code_zero
          target: DIFF
        - condition: exit_code_non_zero
          target: CODE
          feedback: |-
            The test suite failed. Fix the implementation, never the tests.

            stderr:
            {{{EXECUTE_TESTS.output.stderr}}}

            stdout:
            {{{EXECUTE_TESTS.output.stdout}}}

    DIFF:
      kind: Action
      action: tree_diff
      transitions:
        - condition: on_success
          target: AUDIT
        - condition: on_failure
          target: FAILED

    AUDIT:
      kind: ParallelAgents
      agents:
        - agent: "code-reviewer-agent"
          weight: 1.0
          timeout_seconds: 2445
          input: |-
            Review this change for correctness, completeness and the tree's own conventions.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the revision the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The tree is at /workspace. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
        - agent: "critic-agent"
          weight: 1.5
          timeout_seconds: 2445
          input: |-
            Find every flaw in this change: what it gets wrong, what it misses, what it makes worse.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the revision the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The tree is at /workspace. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
        - agent: "security-auditor-agent"
          weight: 2.0
          timeout_seconds: 2445
          input: |-
            Audit this change for security: injection, unchecked input, exposed secrets, unsafe defaults, risky dependencies.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the revision the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The tree is at /workspace. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
      consensus:
        strategy: weighted_average
        threshold: 0.95
        agreement: 0.8
      transitions:
        - condition: consensus
          threshold: 0.95
          agreement: 0.8
          target: COMMIT
        - condition: score_below
          threshold: 0.95
          target: CODE
          feedback: |-
            The review scored the change {{AUDIT.consensus.score}}, below 0.95. The three reports:
            {{{json AUDIT.consensus.metadata.individual_outputs}}}
        # A score at or over 0.95 with agreement under 0.8 matches neither:
        # the change goes back to CODE rather than the run ending here.
        - condition: always
          target: CODE

    COMMIT:
      kind: Action
      action: tree_write
      args:
        message: "carbon-forge: {{{first_line input.task}}}"
      transitions:
        - condition: on_failure
          target: FAILED
        - condition: on_success
          target: DRIFT

    # The lane's drift report, advice for the gate: every outcome goes on.
    # The report's hash rides the step's `commit_sha`, its counts by class
    # `branch`, the whole report `diff`, and a refusal `sentence`.
    DRIFT:
      kind: Action
      action: drift_report
      transitions:
        # draft_only true, or absent (its default), ends with the change on
        # the run's lane and the trunk untouched.
        - condition: custom
          expression: "(default input.draft_only true)"
          target: COMPLETE
        - condition: always
          target: LAND

    LAND:
      kind: Action
      action: tree_land
      args:
        message: "carbon-forge: {{{first_line input.task}}}"
      transitions:
        - condition: on_success
          target: CUT
        - condition: on_failure
          target: LAND_REFUSED

    # The landed run becomes a cut (AEGIS ADR-149 C1): the cut name rides
    # the step's `ref`, the snapshot id its `commit_sha`.
    CUT:
      kind: Action
      action: tree_cut
      args:
        cut: "{{input.cut}}"
      transitions:
        - condition: on_success
          target: COMPLETE
        - condition: on_failure
          target: CUT_REFUSED

    COMPLETE:
      kind: Action
      action: update_blackboard
      args:
        outcome: "complete"
        # The landed changeset, when the run landed; empty for a draft.
        commit_sha: "{{LAND.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        # The cut the landed run became and its snapshot; empty for a draft.
        cut: "{{CUT.output.ref}}"
        snapshot_id: "{{CUT.output.commit_sha}}"
        # The lane's drift report, or the sentence of one not read.
        drift: "{{{DRIFT.output.diff}}}{{{DRIFT.output.sentence}}}"
        sentence: ""
      transitions: []

    # The run's last line states the cause: a failed DIFF's or COMMIT's own
    # sentence, else the error the failed agent state left (each failure
    # comes straight here, so one state at most carries one).
    FAILED:
      kind: Action
      action: update_blackboard
      args:
        outcome: "failed"
        commit_sha: "{{COMMIT.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        sentence: "{{{DIFF.output.sentence}}}{{{COMMIT.output.sentence}}}{{#unless DIFF.output.sentence}}{{#unless COMMIT.output.sentence}}{{{ANALYZE.error}}}{{{ARCHITECT.error}}}{{{TEST.error}}}{{{CODE.error}}}{{/unless}}{{/unless}}"
      transitions: []

    LAND_REFUSED:
      kind: Action
      action: update_blackboard
      args:
        outcome: "land_refused"
        commit_sha: "{{COMMIT.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        drift: "{{{DRIFT.output.diff}}}{{{DRIFT.output.sentence}}}"
        sentence: "{{{LAND.output.sentence}}}"
      transitions: []

    # The run landed and its cut was refused: Carbon Forge's own sentence.
    CUT_REFUSED:
      kind: Action
      action: update_blackboard
      args:
        outcome: "cut_refused"
        commit_sha: "{{LAND.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        drift: "{{{DRIFT.output.diff}}}{{{DRIFT.output.sentence}}}"
        sentence: "{{{CUT.output.sentence}}}"
      transitions: []
