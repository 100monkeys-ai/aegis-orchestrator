#
# The Forge: a development workflow on one repository of the person's.
#
#   ANALYZE ─► AWAIT_REQUIREMENTS_APPROVAL ─yes─► ARCHITECT ─► AWAIT_ARCH_APPROVAL ─yes─► TEST ◄─┐
#      ▲                 │ no                        ▲                  │ no                │    │ the tests
#      └─────────────────┘                           └──────────────────┘                   ▼    │ did not load
#                                                                                     CHECK_TESTS ┘
#                                                                                           │ any other run
#   CODE ◄──────────── exit_code_non_zero ─── EXECUTE_TESTS ◄───────────────────────────── CODE
#    ▲                                            │ exit_code_zero
#    │ score_below 0.95                           ▼
#    └────────────────────────── AUDIT ◄──────── DIFF
#                                  │ consensus 0.95, agreement 0.8
#                                  ▼
#                               COMMIT ─ draft_only (default) ─► COMPLETE
#                                  │ draft_only false
#                                  ▼
#                                LAND ─► COMPLETE, or LAND_REFUSED
#
# DIFF, COMMIT and LAND are the workflow interpreter's own repository steps,
# and COMPLETE, FAILED and LAND_REFUSED its own blackboard writes: no state of
# this workflow runs a shell command in the core process. The suite runs in a
# container on the clone (CHECK_TESTS once after TEST, then EXECUTE_TESTS after
# each CODE). The two Human gates are the only ones.

apiVersion: 100monkeys.ai/v1
kind: Workflow

metadata:
  name: "the-forge"
  version: "2.0.0"
  description: |-
    Develops one change in one of your repositories: requirements and a design,
    each approved by you, then tests written first, the implementation, your
    test suite run in a container on the clone, a review by three judges, and a
    commit on the run's work branch. With draft_only false, the commit then
    lands on the repository's branch as a fast-forward after your approval.
  labels:
    builtin: "true"
    category: "development"
  input_schema:
    type: object
    properties:
      task:
        type: string
        description: "What to change. Its first line names the commit."
      test_command:
        type: string
        description: "The test suite, run by /bin/sh -c in the repository's root."
      test_image:
        type: string
        description: "The image the test suite runs in, a reference with a tag."
      context:
        type: string
        description: "Anything else the analyst should know."
      draft_only:
        type: boolean
        default: true
        description: "True (the default) ends the run with the commit on the work branch and nothing pushed; false lands it on the repository's branch after your approval."
      tree_reset:
        type: string
        enum: ["hard", "list", "none"]
        default: "hard"
        description: "How the repository's tree is left before the first state: hard (the default) resets it to the commit the run starts from and removes every untracked and ignored path; list removes untracked paths and the ignored paths the purge patterns match; none removes untracked paths that are not ignored."
      purge:
        type: array
        items:
          type: string
        default: []
        description: "With tree_reset list, the glob patterns of untracked or ignored paths to remove, as git's pathspec matches them: a directory is matched as dir/ or dir/**. A tracked file is never removed."
      test_globs:
        type: array
        items:
          type: string
        default: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/test_*", "**/*_test.*", "**/*.test.*"]
        description: "The glob patterns the repository's tracked test files are listed by, for the tester."
    required:
      - task
      - test_command
      - test_image

spec:
  # The run names exactly one repository by the dispatch key `repositories`.
  repositories: 1

  context:
    max_code_iterations: 5

  initial_state: ANALYZE

  states:

    ANALYZE:
      kind: Agent
      agent: "requirements-analyst"
      input: |-
        # The task
        {{{input.task}}}
        {{#if input.context}}

        # Context
        {{{input.context}}}
        {{/if}}

        # The repository
        The repository is at {{repository.path}}, on the work branch {{repository.branch}}, which started from {{repository.started_from}} on {{repository.ref}}. Read it before you answer: its layout, its conventions, the code the task touches and its tests. Change nothing.

        The test suite will be run in the repository's root with: {{{input.test_command}}}
        {{#if AWAIT_REQUIREMENTS_APPROVAL}}

        # Your last requirements were sent back
        The person answered "{{AWAIT_REQUIREMENTS_APPROVAL.response}}" to them. Write them again, closer to the task.
        {{#if human.feedback}}
        Their words: {{{human.feedback}}}
        {{/if}}
        {{/if}}

        Answer with the functional requirements, the non-functional requirements and the acceptance criteria, each numbered and each checkable by a test.
      transitions:
        - condition: on_success
          target: AWAIT_REQUIREMENTS_APPROVAL
        - condition: on_failure
          target: FAILED

    AWAIT_REQUIREMENTS_APPROVAL:
      kind: Human
      timeout: 3600s
      prompt: |-
        # The Forge: approve the requirements

        ## The task
        {{{input.task}}}

        ## The requirements
        {{{json ANALYZE.output}}}

        Answer yes to design the change against them, or no with what to change.
      transitions:
        - condition: input_equals_yes
          target: ARCHITECT
        - condition: input_equals_no
          target: ANALYZE
          feedback: "{{human.feedback}}"

    ARCHITECT:
      kind: Agent
      agent: "architect-agent"
      input: |-
        # The task
        {{{input.task}}}

        # The approved requirements
        {{{json ANALYZE.output}}}

        # The repository
        The repository is at {{repository.path}}, on the work branch {{repository.branch}}. Read its layout and its conventions before you design anything. Change nothing.
        {{#if AWAIT_ARCH_APPROVAL}}

        # Your last design was sent back
        The person answered "{{AWAIT_ARCH_APPROVAL.response}}" to it. Design it again, closer to the requirements.
        {{#if human.feedback}}
        Their words: {{{human.feedback}}}
        {{/if}}
        {{/if}}

        Design the change against the requirements and the repository's own conventions. Name every file to change or create, by its path under {{repository.path}}, with what changes in it, and name the tests that will show each acceptance criterion met.
      transitions:
        - condition: on_success
          target: AWAIT_ARCH_APPROVAL
        - condition: on_failure
          target: FAILED

    AWAIT_ARCH_APPROVAL:
      kind: Human
      timeout: 3600s
      prompt: |-
        # The Forge: approve the design

        ## The task
        {{{input.task}}}

        ## The requirements
        {{{json ANALYZE.output}}}

        ## The design
        {{{json ARCHITECT.output}}}

        Answer yes to write the tests and the implementation, or no with what to change.
      transitions:
        - condition: input_equals_yes
          target: TEST
        - condition: input_equals_no
          target: ARCHITECT
          feedback: "{{human.feedback}}"

    TEST:
      kind: Agent
      agent: "tester-agent"
      # TEST and CHECK_TESTS's returns to it: a third suite that does not load
      # ends the run.
      max_state_visits: 3
      input: |-
        # The approved requirements
        {{{json ANALYZE.output}}}

        # The approved design
        {{{json ARCHITECT.output}}}

        # The repository
        The repository is at {{repository.path}}, on the work branch {{repository.branch}}. The suite will be run in its root with: {{{input.test_command}}}

        # The test files it tracks
        {{#if repository.tests}}{{{json repository.tests}}}{{else}}None: it tracks no test file.{{/if}}
        {{#if CHECK_TESTS}}

        # The tests did not load
        The suite was run once on the tests you wrote, and a file you wrote did not load: it does not parse, or its own module cannot be imported. Fix those files so that every test loads and runs; a test may still fail where the implementation is not written yet. Change no implementation file.

        stderr:
        {{{CHECK_TESTS.output.stderr}}}

        stdout:
        {{{CHECK_TESTS.output.stdout}}}
        {{/if}}

        Write the tests that show each acceptance criterion met, in the repository's own test layout and style, under {{repository.path}}. Write tests only: change no implementation file.
      transitions:
        - condition: on_success
          target: CHECK_TESTS
        - condition: on_failure
          target: FAILED

    CHECK_TESTS:
      kind: ContainerRun
      name: "the-forge-check-tests"
      image: "{{input.test_image}}"
      shell: true
      # The suite once, before CODE, with EXECUTE_TESTS's image and command.
      # Its output is printed as it was. When it shows that a test file the
      # tester wrote did not load, the step exits 86 and the run goes back to
      # TEST; any other run, its own exit code (a suite's own 86 as 1), goes
      # to CODE. A file does not load when the suite names it as not loaded
      # (unittest's _FailedTest, pytest's "ERROR collecting") and either a
      # SyntaxError, IndentationError or TabError points into the clone, or
      # the module that cannot be found is the test module itself. A test
      # importing code not written yet is CODE's to write. At this step the
      # clone holds no change but the tester's. The suite runs in a subshell,
      # so its own exit ends only it. Plain sh, grep and sed: the image is the
      # person's.
      command:
        - |-
          out="${TMPDIR:-/tmp}/forge-check-tests.$$.out"
          err="${TMPDIR:-/tmp}/forge-check-tests.$$.err"
          (eval "$FORGE_TEST_COMMAND") >"$out" 2>"$err"
          code=$?
          cat "$out"
          cat "$err" >&2
          all="$out.all"
          cat "$out" "$err" >"$all"
          loaded=yes
          if grep -Eq '_FailedTest|Failed to import test module|ERROR collecting|ImportError while importing test module' "$all"; then
            where=$(sed -nE '/File "/h; /(SyntaxError|IndentationError|TabError): /{x;p;q;}' "$all")
            case "$where" in
              *'File "'"$PWD/"*) loaded=no ;;
              *'File "/'*|*'File "<'*|'') ;;
              *'File "'*) loaded=no ;;
            esac
            for missing in $(sed -n "s/.*No module named '\([^']*\)'.*/\1/p" "$all"); do
              for module in $(sed -n 's/.*Failed to import test module: \([A-Za-z0-9_.]*\).*/\1/p' "$all") $(sed -n 's/.*ERROR collecting \([^ ]*\)\.py.*/\1/p' "$all" | tr / .); do
                case "$module" in
                  "$missing"|"$missing".*|*."$missing") loaded=no ;;
                esac
              done
            done
          fi
          rm -f "$out" "$err" "$all"
          if [ "$loaded" = no ]; then exit 86; fi
          if [ "$code" -eq 86 ]; then exit 1; fi
          exit "$code"
      env:
        FORGE_TEST_COMMAND: "{{{input.test_command}}}"
      workdir: "/workspace/repository"
      volumes:
        - name: repository
          mount_path: "/workspace/repository"
      network_mode: egress
      resources:
        cpu: 2000
        memory: "4Gi"
        timeout: 1800s
      transitions:
        - condition: exit_code
          value: 86
          target: TEST
        - condition: always
          target: CODE

    CODE:
      kind: Agent
      agent: "coder-agent"
      max_state_visits: 5
      input: |-
        # The approved requirements
        {{{json ANALYZE.output}}}

        # The approved design
        {{{json ARCHITECT.output}}}

        # The tests written for it
        {{{json TEST.output}}}

        # The repository
        The repository is at {{repository.path}}, on the work branch {{repository.branch}}. The suite will be run in its root with: {{{input.test_command}}}
        {{#if EXECUTE_TESTS}}

        # The last run of the suite
        Exit code {{EXECUTE_TESTS.output.exit_code}}.

        stderr:
        {{{EXECUTE_TESTS.output.stderr}}}

        stdout:
        {{{EXECUTE_TESTS.output.stdout}}}
        {{else}}
        {{#if CHECK_TESTS}}

        # The last run of the suite
        Exit code {{CHECK_TESTS.output.exit_code}}.

        stderr:
        {{{CHECK_TESTS.output.stderr}}}

        stdout:
        {{{CHECK_TESTS.output.stdout}}}
        {{/if}}
        {{/if}}
        {{#if AUDIT}}

        # The last review
        The three judges scored the change {{AUDIT.consensus.score}} (0.95 passes). Their reports:
        {{{json AUDIT.consensus.metadata.individual_outputs}}}

        A review's suggestion to change, delete or add a test is not yours to apply: leave the tests as the tester wrote them and name the suggestion in your answer.

        # The change they reviewed (a unified diff: lines beginning with - and + are the diff's markers, not the text)
        {{{DIFF.output.diff}}}
        {{/if}}

        Change the implementation under {{repository.path}} as the design says, so that the suite passes. Never change the tests the tester wrote. When the suite has failed or the review has scored the change below 0.95, fix what the output and the reports name.
      transitions:
        - condition: on_success
          target: EXECUTE_TESTS
        - condition: on_failure
          target: FAILED

    EXECUTE_TESTS:
      kind: ContainerRun
      name: "the-forge-tests"
      image: "{{input.test_image}}"
      shell: true
      # The suite reaches the step's shell through its environment, never
      # spliced into the shell text.
      command:
        - "eval \"$FORGE_TEST_COMMAND\""
      env:
        FORGE_TEST_COMMAND: "{{{input.test_command}}}"
      workdir: "/workspace/repository"
      volumes:
        - name: repository
          mount_path: "/workspace/repository"
      network_mode: egress
      resources:
        cpu: 2000
        memory: "4Gi"
        timeout: 1800s
      transitions:
        - condition: exit_code_zero
          target: DIFF
        - condition: exit_code_non_zero
          target: CODE
          feedback: |-
            The test suite failed. Fix the implementation, never the tests.

            stderr:
            {{{EXECUTE_TESTS.output.stderr}}}

            stdout:
            {{{EXECUTE_TESTS.output.stdout}}}

    DIFF:
      kind: Action
      action: repository_diff
      transitions:
        - condition: on_success
          target: AUDIT
        - condition: on_failure
          target: FAILED

    AUDIT:
      kind: ParallelAgents
      agents:
        - agent: "code-reviewer-agent"
          weight: 1.0
          timeout_seconds: 2445
          input: |-
            Review this change for correctness, completeness and the repository's own conventions.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the commit the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The repository is at {{repository.path}}. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
        - agent: "critic-agent"
          weight: 1.5
          timeout_seconds: 2445
          input: |-
            Find every flaw in this change: what it gets wrong, what it misses, what it makes worse.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the commit the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The repository is at {{repository.path}}. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
        - agent: "security-auditor-agent"
          weight: 2.0
          timeout_seconds: 2445
          input: |-
            Audit this change for security: injection, unchecked input, exposed secrets, unsafe defaults, risky dependencies.

            # The requirements
            {{{json ANALYZE.output}}}

            # The design
            {{{json ARCHITECT.output}}}

            # The change, as a unified diff against the commit the run started from
            Lines beginning with - and + are the diff's markers, not the text.
            {{{DIFF.output.diff}}}

            # The test output (the suite passed)
            {{{EXECUTE_TESTS.output.stdout}}}

            The repository is at {{repository.path}}. Answer only with the JSON object {"score", "confidence", "reasoning", "suggestions"}.
      consensus:
        strategy: weighted_average
        threshold: 0.95
        agreement: 0.8
      transitions:
        - condition: consensus
          threshold: 0.95
          agreement: 0.8
          target: COMMIT
        - condition: score_below
          threshold: 0.95
          target: CODE
          feedback: |-
            The review scored the change {{AUDIT.consensus.score}}, below 0.95. The three reports:
            {{{json AUDIT.consensus.metadata.individual_outputs}}}
        # A score at or over 0.95 with agreement under 0.8 matches neither:
        # the change goes back to CODE rather than the run ending here.
        - condition: always
          target: CODE

    COMMIT:
      kind: Action
      action: repository_commit
      args:
        message: "the-forge: {{{first_line input.task}}}"
      transitions:
        - condition: on_failure
          target: FAILED
        # draft_only true, or absent (its default), ends with the commit on
        # the work branch and nothing pushed.
        - condition: custom
          expression: "(default input.draft_only true)"
          target: COMPLETE
        - condition: on_success
          target: LAND

    LAND:
      kind: Action
      action: repository_land
      transitions:
        - condition: on_success
          target: COMPLETE
        - condition: on_failure
          target: LAND_REFUSED

    COMPLETE:
      kind: Action
      action: update_blackboard
      args:
        outcome: "complete"
        commit_sha: "{{COMMIT.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        sentence: ""
      transitions: []

    # The run's last line states the cause: a failed DIFF's or COMMIT's own
    # sentence, else the error the failed agent state left (each failure
    # comes straight here, so one state at most carries one).
    FAILED:
      kind: Action
      action: update_blackboard
      args:
        outcome: "failed"
        commit_sha: "{{COMMIT.output.commit_sha}}"
        branch: "{{repository.branch}}"
        sentence: "{{{DIFF.output.sentence}}}{{{COMMIT.output.sentence}}}{{#unless DIFF.output.sentence}}{{#unless COMMIT.output.sentence}}{{{ANALYZE.error}}}{{{ARCHITECT.error}}}{{{TEST.error}}}{{{CODE.error}}}{{/unless}}{{/unless}}"
      transitions: []

    LAND_REFUSED:
      kind: Action
      action: update_blackboard
      args:
        outcome: "land_refused"
        commit_sha: "{{COMMIT.output.commit_sha}}"
        branch: "{{COMMIT.output.branch}}"
        sentence: "{{{LAND.output.sentence}}}"
      transitions: []
