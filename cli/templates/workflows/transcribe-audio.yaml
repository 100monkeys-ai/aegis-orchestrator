apiVersion: 100monkeys.ai/v1
kind: Workflow
metadata:
  name: transcribe-audio
  version: "1.0.0"
  description: >-
    Transcribes one audio file to text with a pinned speech-to-text model, on
    the CPU, with no network and no language model. The file is read from the
    run's audio volume; the transcript is written beside it as transcript.txt
    and is the run's answer.
  labels:
    category: platform
    type: builtin-model
    builtin: "true"
  input_schema:
    type: object
    properties:
      audio_path:
        type: string
        description: >-
          The audio file's path inside the audio volume: letters, digits and
          - . _ / only, not starting with / or containing "..". Any container
          ffmpeg decodes (wav, mp3, m4a, ogg, flac, webm).
        maxLength: 512
        pattern: "^(?!/)(?!.*\\.\\.)[A-Za-z0-9._/-]+$"
    required:
      - audio_path
  output_schema:
    type: object
    properties:
      transcript:
        type: string
        description: The transcript, as UTF-8 text
      exit_code:
        type: integer
        description: The model step's exit code
  output_template:
    transcript: "{{TRANSCRIBE.stdout}}"
    exit_code: "{{TRANSCRIBE.exit_code}}"
spec:
  initial_state: TRANSCRIBE
  storage:
    shared_volumes:
      - name: audio
        storage_class: persistent
  states:
    # A model step: the image is the registry's pinned speech-to-text model,
    # resolved at registration; it runs with no network, and the registry's
    # entry sets its CPU, memory and timeout.
    TRANSCRIBE:
      kind: ContainerRun
      name: "Transcribe"
      image: "model:speech-to-text/whisper-base"
      command: ["transcribe", "/data/{{input.audio_path}}", "--out", "/data/transcript.txt"]
      workdir: /data
      volumes:
        - name: audio
          mount_path: /data
      shell: false
      transitions:
        - condition: exit_code_zero
          target: DONE
        - condition: exit_code_non_zero
          target: FAILED
          feedback: "The recording could not be transcribed: {{{TRANSCRIBE.stderr}}}"
    DONE:
      kind: System
      command: "echo transcribed"
      transitions: []
    FAILED:
      kind: System
      command: "echo 'transcription failed' >&2; exit 1"
      transitions: []
